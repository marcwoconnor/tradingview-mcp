name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # The no-connection suite (injection, replay, pine analysis, CLI).
      # The e2e suite needs a live TradingView Desktop + CDP, so it is not run in CI.
      - name: Unit tests
        run: npm run test:unit
